<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #F5F3EC;
    min-height: 100vh;
    margin: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    /* new SVG noise */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    background-repeat: repeat;
    opacity: 0.8; 
    mix-blend-mode: multiply;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(to right, rgba(10, 22, 40, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.05) 1px, transparent 1px),
      linear-gradient(to right, rgba(10, 22, 40, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.04) 1px, transparent 1px),
      linear-gradient(to right, rgba(10, 22, 40, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.06) 1px, transparent 1px);
    background-size: 
      54px 54px, 54px 54px,
      89px 89px, 89px 89px,
      144px 144px, 144px 144px;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
</body>
</html>
