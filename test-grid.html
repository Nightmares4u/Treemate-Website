<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #F5F3EC;
    min-height: 100vh;
    margin: 0;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(to right, rgba(10, 22, 40, 0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.035) 1px, transparent 1px),
      linear-gradient(to right, rgba(10, 22, 40, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.045) 1px, transparent 1px),
      linear-gradient(to right, rgba(10, 22, 40, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 22, 40, 0.055) 1px, transparent 1px);
    background-size: 
      72px 72px, 72px 72px,
      116px 116px, 116px 116px,
      168px 168px, 168px 168px;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
</body>
</html>
